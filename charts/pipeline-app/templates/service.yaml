apiVersion: v1
kind: Service
metadata:
  name: {{ include "pipeline-app.name" . }}
  labels:
    {{- include "pipeline-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "pipeline-app.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
