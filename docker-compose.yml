# Local dev stack: same apps, same data flow, no Kubernetes.
# Use this to build and debug the producer/consumer before touching EKS.
#
#   docker compose up --build
#   Elasticsearch: http://localhost:9200/auth-events-*/_count
#   Postgres:   psql postgresql://app:app@localhost:5432/events
#   Metrics:    http://localhost:8001/metrics (producer), :8002 (consumer)
#
# Security is disabled on Elasticsearch here for convenience only.
# The EKS deployment uses ECK, which turns auth on.

services:
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: events
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d events"]
      interval: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      retries: 30

  producer:
    build: ./apps/producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EVENTS_PER_SECOND: "5"
      ATTACK_PROBABILITY: "0.03"
    ports:
      - "8001:8000"
    depends_on:
      kafka:
        condition: service_healthy

  consumer:
    build: ./apps/consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PG_DSN: postgresql://app:app@postgres:5432/events
      ES_URL: http://elasticsearch:9200
    ports:
      - "8002:8000"
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
