# Shared definition of the pipeline. Environments in ../overlays/ layer their
# own image tags, sizes, and scaling limits on top of this.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - kafka.yaml
  - kafka-podmonitor.yaml
  - postgres.yaml
  - elasticsearch.yaml
  - producer.yaml
  - consumer.yaml
  - alerts.yaml
  - grafana-dashboard.yaml
  # Optional: SQL across Postgres and Elasticsearch. Uncomment once the rest of
  # the pipeline is healthy; it needs roughly 3Gi of extra memory.
  # - trino.yaml
