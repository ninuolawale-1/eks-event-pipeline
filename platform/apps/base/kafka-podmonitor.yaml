# Scrapes the Strimzi Kafka Exporter (consumer lag, partition offsets)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka-exporter
  namespace: pipeline
spec:
  selector:
    matchLabels:
      strimzi.io/name: events-kafka-exporter
  podMetricsEndpoints:
    - port: tcp-prometheus
      path: /metrics
      interval: 30s
