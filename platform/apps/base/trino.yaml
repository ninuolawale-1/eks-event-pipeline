# Optional (Phase 5): Trino runs one SQL query across Postgres and Elasticsearch.
# Enable it by uncommenting `- trino.yaml` in kustomization.yaml.
# The Trino chart's values change between versions; if the release fails,
# compare against `helm show values trino/trino`.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trino
  namespace: pipeline
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: trino
      version: ">=0.30.0"
      sourceRef:
        kind: HelmRepository
        name: trino
        namespace: flux-system
  install:
    remediation:
      retries: 2
  values:
    server:
      workers: 1
    coordinator:
      jvm:
        maxHeapSize: "1G"
      resources:
        requests:
          cpu: 250m
          memory: 1536Mi
        limits:
          memory: 1536Mi
    worker:
      jvm:
        maxHeapSize: "1G"
      resources:
        requests:
          cpu: 250m
          memory: 1536Mi
        limits:
          memory: 1536Mi
    env:
      - name: PG_USER
        valueFrom:
          secretKeyRef:
            name: events-db-app
            key: username
      - name: PG_PASSWORD
        valueFrom:
          secretKeyRef:
            name: events-db-app
            key: password
      - name: ES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: events-es-elastic-user
            key: elastic
    catalogs:
      postgres: |
        connector.name=postgresql
        connection-url=jdbc:postgresql://events-db-rw.pipeline.svc:5432/events
        connection-user=${ENV:PG_USER}
        connection-password=${ENV:PG_PASSWORD}
      elastic: |
        connector.name=elasticsearch
        elasticsearch.host=events-es-http.pipeline.svc
        elasticsearch.port=9200
        elasticsearch.default-schema-name=default
        elasticsearch.tls.enabled=false
        elasticsearch.security=PASSWORD
        elasticsearch.auth.user=elastic
        elasticsearch.auth.password=${ENV:ES_PASSWORD}
