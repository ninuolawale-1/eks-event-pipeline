# Two-instance PostgreSQL cluster (one primary, one streaming replica) with
# automatic failover. CloudNativePG creates:
#   Service  events-db-rw   -> always points at the current primary
#   Service  events-db-ro   -> replicas only
#   Secret   events-db-app  -> username, password, and a ready-made `uri`
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: events-db
  namespace: pipeline
spec:
  instances: 2
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: events
      owner: app
  postgresql:
    parameters:
      shared_buffers: 64MB
      max_connections: "50"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
