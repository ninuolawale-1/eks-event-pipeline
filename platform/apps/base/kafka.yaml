# Three-node Kafka cluster in KRaft mode (no ZooKeeper). Each node is both a
# controller and a broker, which is fine for a lab. Production clusters
# usually split controllers and brokers into separate node pools.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: pipeline
  labels:
    strimzi.io/cluster: events
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        deleteClaim: true        
        kraftMetadata: shared
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 1536Mi
  jvmOptions:
    "-Xms": 512m
    "-Xmx": 768m
  template:
    pod:
      affinity:
        # Spread brokers across nodes so losing one node only loses one broker
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    strimzi.io/cluster: events
                    strimzi.io/pool-name: dual-role
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: events
  namespace: pipeline
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      auto.create.topics.enable: false   # topics are declared below as KafkaTopic resources
  entityOperator:
    topicOperator: {}
    userOperator: {}
  # Exposes consumer-group lag and topic metrics to Prometheus
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: auth-events
  namespace: pipeline
  labels:
    strimzi.io/cluster: events
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: 259200000      # 3 days
    min.insync.replicas: 2
    compression.type: producer
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: auth-events-dlq
  namespace: pipeline
  labels:
    strimzi.io/cluster: events
spec:
  partitions: 1
  replicas: 3
  config:
    retention.ms: 604800000      # 7 days, long enough to investigate bad messages
