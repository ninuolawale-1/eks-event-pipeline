# Strimzi operator: manages Kafka clusters, node pools, and topics as Kubernetes resources.
# Strimzi 1.x only supports the kafka.strimzi.io/v1 API, which platform/apps/base/kafka.yaml uses.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: strimzi-kafka-operator
  namespace: strimzi-system
spec:
  interval: 30m
  chart:
    spec:
      chart: strimzi-kafka-operator
      version: ">=1.0.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: strimzi
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    watchAnyNamespace: true
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 384Mi
