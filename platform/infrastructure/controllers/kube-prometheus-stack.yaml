# Prometheus, Alertmanager, Grafana, node-exporter, kube-state-metrics.
# Trimmed for a 3-node lab cluster.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: ">=70.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # EKS manages these control-plane components; Prometheus can't scrape them
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false

    alertmanager:
      alertmanagerSpec:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi

    prometheus:
      prometheusSpec:
        retention: 3d
        # Pick up ServiceMonitors/PodMonitors from every namespace, not just
        # ones labelled with this Helm release
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        resources:
          requests:
            cpu: 200m
            memory: 768Mi
          limits:
            memory: 1536Mi

    grafana:
      # Default admin password comes from a generated secret; see scripts/port-forward.sh
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          searchNamespace: ALL
      resources:
        requests:
          cpu: 50m
          memory: 192Mi
