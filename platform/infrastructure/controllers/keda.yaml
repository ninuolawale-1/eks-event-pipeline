# KEDA: event-driven autoscaling. Lets the consumer scale on Kafka lag
# (see charts/pipeline-app/templates/scaledobject.yaml).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: keda
spec:
  # Its ServiceMonitors need the Prometheus Operator CRDs to exist first
  dependsOn:
    - name: kube-prometheus-stack
      namespace: monitoring
  interval: 30m
  chart:
    spec:
      chart: keda
      version: ">=2.16.0 <3.0.0"
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    prometheus:
      operator:
        enabled: true
        serviceMonitor:
          enabled: true
      metricServer:
        enabled: true
        serviceMonitor:
          enabled: true
